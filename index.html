<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="result" role="status" aria-live="polite"></p>
  <section id="draft-panel" hidden>
    <p>Тема: <strong id="topic"></strong></p>
    <h2>Черновик ответа</h2>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const button = document.querySelector('button[type="submit"]');
    const result = document.querySelector("#result");
    const draftPanel = document.querySelector("#draft-panel");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const topics = { delivery: "Доставка", pricing: "Цены", other: "Другое" };

    /** @returns {void} */
    function clearDraft() {
      topic.textContent = "";
      draft.textContent = "";
      draftPanel.hidden = true;
    }

    /**
     * @param {SubmitEvent} event
     * @returns {Promise<void>}
     */
    async function handleSubmit(event) {
      event.preventDefault();
      if (button.disabled) return;

      clearDraft();
      const text = message.value.trim();
      if (!text) {
        result.textContent = "Введите текст заявки.";
        return;
      }

      button.disabled = true;
      result.textContent = "Разбираем заявку…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const data = await reply.json();
        if (reply.status === 400 && data?.status === "invalid_input") {
          result.textContent = "Введите непустой текст заявки.";
          return;
        }
        if (
          !reply.ok ||
          data?.status !== "ready" ||
          typeof data.topic !== "string" ||
          !Object.hasOwn(topics, data.topic) ||
          typeof data.draft !== "string" ||
          data.draft.trim().length === 0
        ) {
          throw new Error("Automatic triage unavailable");
        }

        topic.textContent = topics[data.topic];
        draft.textContent = data.draft;
        draftPanel.hidden = false;
        result.textContent = "Проверьте черновик перед отправкой клиенту.";
      } catch {
        clearDraft();
        result.textContent = "Автоматический разбор недоступен. Разберите заявку вручную и подготовьте ответ клиенту.";
      } finally {
        button.disabled = false;
      }
    }

    form.addEventListener("submit", handleSubmit);
  </script>
</body>
</html>
